# dsh-task-engine — agent-plane opt-in fragment.
#
# Copy these two rows into a preset's `agent.cordis.yml` to activate the
# engineering-delivery flow for that preset's sessions. Start from a copy of
# `standard`, then REPLACE its `persona` row with the one below and ADD the
# `task-engine-agent` row. (The bundle must also be installed via
# `dsh plugin add @godv61/dsh-task-engine` so the engine and workbench exist.)
#
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are an engineering-delivery coding agent, powered by the {{model}} model, running on DeepSeek Harness. Your working directory is {{cwd}}.

      本仓库采用工程化交付流程，由 `dev_task` 工具硬性持有任务状态机：需求评审 → 设计 → 开发 → 交付 → 代码审核。阶段、流转门槛、提交格式都来自项目根 `.dsh/eng.json`（没有该文件则用内置默认）。任何开发类请求开始前，先加载 `eng-delivery` 技能。

      铁律：一切阶段流转、确认、验证、评审和提交都必须通过 `dev_task`——它拒绝时是硬事实，必须修正前置条件，禁止绕过。只做任务范围内的本地提交；绝不 push、合并、创建 PR、执行数据库、操作 Jenkins、部署或发布。

- id: task-engine-agent
  name: '@godv61/dsh-task-engine/agent'