name: Verify package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:package
      # Exercise the actual supported preset and real Go events in a required job.
      - uses: actions/setup-go@v5
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm run verify:go
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      - name: Verify current DSH preset runtime
        run: npm run verify:preset
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22

  # The C++ evidence parser is only trustworthy if the same code is exercised
  # against real tools. Linux pins Ninja (single-config); Windows deliberately
  # keeps the default Visual Studio generator, because a multi-config cache
  # needs `--config`/`-C` and previously reported every test as "***Not Run".
  # REQUIRE_CPP_EVIDENCE=1 turns a missing toolchain or a skipped smoke test
  # into a failure instead of a green run that proves nothing.
  cpp-evidence:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Install CMake, Ninja and GoogleTest
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtest-dev
      - name: Install GoogleTest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install gtest:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install gtest failed with $LASTEXITCODE" }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path $toolchain)) { throw "vcpkg toolchain not found at $toolchain" }
      - name: Run real CTest and GoogleTest evidence tests (Linux, Ninja)
        if: runner.os == 'Linux'
        env:
          REQUIRE_CPP_EVIDENCE: '1'
          CMAKE_GENERATOR: Ninja
        run: node --test .verification-test.mjs
      - name: Run real CTest and GoogleTest evidence tests (Windows, default Visual Studio generator)
        if: runner.os == 'Windows'
        env:
          REQUIRE_CPP_EVIDENCE: '1'
          CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: node --test .verification-test.mjs

  preset-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.1-rc.3, 0.2.1-rc.4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify:preset
        env:
          TASK_ENGINE_DSH_VERSION: ${{ matrix.dsh }}

  # The plugin's Typert Remote contribution must satisfy the strict-codec
  # contract the INSTALLED DSH expects. DSH 0.1.6-alpha.2 changed it from a
  # materialized `schema` to a lazy `create()` factory and rejected the old
  # shape at plugin load, so the workbench and dev_task never mounted — a
  # failure none of the unit tests above can see, because they never load the
  # descriptors through a real registry. npm semver cannot wildcard
  # prereleases, so a new DSH alpha silently falls outside the peer range and
  # pnpm only warns at install time. This job checks the contract where it
  # actually lives and fails the build when the two drift apart.
  dsh-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # `master` catches a breaking change as soon as DSH makes it; the pinned
        # release candidate keeps the supported 0.2 baseline pinned.
        dsh: [master, dsh-v0.2.1-rc.3, dsh-v0.2.1-rc.4, dsh-v0.2.1-rc.5]
    continue-on-error: ${{ matrix.dsh == 'master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # A shallow checkout is enough: the check reads package.json and the
      # protocol's type declarations, not the whole build.
      - name: Check out DSH
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.dsh }}
          path: dsh
          fetch-depth: 1
      - name: Verify the codec contract against DSH ${{ matrix.dsh }}
        run: npm run verify:dsh -- ${{ github.workspace }}/dsh
