name: Verify package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The current host/build dependencies require Node 24. Legacy jobs
          # switch to Node 22 only after building to test the older host runtime.
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - name: Prepare public legacy SDK dependencies on Node 24
        if: runner.os == 'Windows' && matrix.node == 22
        timeout-minutes: 10
        shell: pwsh
        run: |
          $sdkCache = Join-Path $env:RUNNER_TEMP 'task-engine-legacy-sdk'
          New-Item -ItemType Directory -Path $sdkCache -Force | Out-Null
          '{"name":"task-engine-legacy-sdk","private":true,"type":"module"}' | Set-Content -LiteralPath (Join-Path $sdkCache 'package.json') -Encoding utf8
          npm install --prefix $sdkCache --ignore-scripts --no-audit --no-fund --prefer-offline --fetch-retries=0 --registry=https://registry.npmjs.org/ @deepseek-ai/dsh@0.2.1-rc.5 @deepseek-ai/dsh-sdk-client@0.2.1-rc.5 @deepseek-ai/dsh-agent-preset-registry@0.2.1-rc.5 @deepseek-ai/dsh-tool-subagent@0.2.1-rc.5
          if ($LASTEXITCODE -ne 0) { throw "Legacy SDK dependency setup failed: $LASTEXITCODE" }
          "TASK_ENGINE_PRESET_NODE_MODULES=$(Join-Path $sdkCache 'node_modules')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
        if: matrix.node == 24
      - run: npm run verify:package
        if: matrix.node == 24
      - uses: actions/setup-node@v4
        if: matrix.node == 22
        with:
          node-version: 22
      - name: Verify legacy DSH preset runtime on Node 22
        if: matrix.node == 22
        run: npm run verify:preset
        env:
          TASK_ENGINE_DSH_VERSION: 0.2.1-rc.5
      # Exercise the actual supported preset and real Go events in a required job.
      - uses: actions/setup-go@v5
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm run verify:go
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      - name: Verify current DSH preset runtime
        run: npm run verify:preset
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24

  preset-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.1-rc.3, 0.2.1-rc.4, 0.2.1-rc.5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:preset
        env:
          TASK_ENGINE_DSH_VERSION: ${{ matrix.dsh }}

  # The plugin's Typert Remote contribution must satisfy the strict-codec
  # contract the INSTALLED DSH expects. DSH 0.1.6-alpha.2 changed it from a
  # materialized `schema` to a lazy `create()` factory and rejected the old
  # shape at plugin load, so the workbench and dev_task never mounted — a
  # failure none of the unit tests above can see, because they never load the
  # descriptors through a real registry. npm semver cannot wildcard
  # prereleases, so a new DSH alpha silently falls outside the peer range and
  # pnpm only warns at install time. This job checks the contract where it
  # actually lives and fails the build when the two drift apart.
  dsh-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # `master` catches a breaking change as soon as DSH makes it; the pinned
        # release candidate keeps the supported 0.2 baseline pinned.
        dsh: [master, dsh-v0.2.1-rc.3, dsh-v0.2.1-rc.4, dsh-v0.2.1-rc.5, dsh-v0.2.2-rc.1]
    continue-on-error: ${{ matrix.dsh == 'master' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # A shallow checkout is enough: the check reads package.json and the
      # protocol's type declarations, not the whole build.
      - name: Check out DSH
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.dsh }}
          path: dsh
          fetch-depth: 1
      - name: Verify the codec contract against DSH ${{ matrix.dsh }}
        run: npm run verify:dsh -- ${{ github.workspace }}/dsh
